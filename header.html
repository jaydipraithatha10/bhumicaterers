<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#160807">
<title>Bhumi Caterers — Header</title>
<style>
:root{
  --black:#120707;--wine:#4b0d0d;--maroon:#7c1717;
  --gold:#d7a84b;--gold2:#f4d27b;--cream:#fff6e5;
}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#faf7f0}
.header{
  position:sticky;top:0;z-index:99;
  color:white;background:rgba(18,7,7,.97);
  border-bottom:1px solid rgba(215,168,75,.65);
  box-shadow:0 8px 30px rgba(0,0,0,.22);
}
.top{
  max-width:1240px;margin:auto;min-height:86px;padding:10px 22px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.brand{display:flex;align-items:center;gap:13px;text-decoration:none;color:white;min-width:max-content}
.logo{
  width:52px;height:52px;border:2px solid var(--gold);border-radius:50%;
  display:grid;place-items:center;color:var(--gold2);font-size:24px;
  background:radial-gradient(circle,#6d1616,#250909);
  box-shadow:inset 0 0 0 4px #2a0b0b,0 0 15px rgba(215,168,75,.18);
}
.brand strong{
  display:block;font-family:Georgia,serif;font-size:25px;letter-spacing:1.5px;
  text-shadow:2px 2px #3a0808;
}
.brand span{display:block;color:#e9cf91;font-size:10px;letter-spacing:1.5px;margin-top:3px}
.nav{display:flex;align-items:center;gap:5px}
.nav a{
  color:#fff8e8;text-decoration:none;font-size:14px;padding:11px 13px;border-radius:20px;
  transition:.2s
}
.nav a:hover{background:#5d1111;color:#f4d27b}
.cta{
  text-decoration:none;color:#230707;background:linear-gradient(135deg,#f4d27b,#c89637);
  font-weight:800;font-size:13px;padding:12px 18px;border-radius:24px;
  box-shadow:0 5px 15px rgba(215,168,75,.18);white-space:nowrap
}
.mobile{display:none;background:none;border:1px solid #8f6428;color:#f4d27b;border-radius:9px;padding:9px 11px;font-size:20px}
@media(max-width:800px){
 .top{min-height:72px;padding:9px 14px}
 .logo{width:45px;height:45px;font-size:20px}.brand strong{font-size:19px}.brand span{font-size:8px}
 .mobile{display:block}.nav{display:none;position:absolute;left:10px;right:10px;top:78px;background:#1b0808;
 border:1px solid #7d5621;border-radius:14px;padding:10px;box-shadow:0 12px 30px #0008}
 .nav.open{display:flex;flex-direction:column;align-items:stretch}.nav a{text-align:center;padding:13px}
 .cta{padding:10px 13px;font-size:11px}
}
</style>
</head>
<body>

<header class="header">
  <div class="top">
    <a class="brand" href="#">
      <div class="logo">♨</div>
      <div>
        <strong>BHUMI CATERERS</strong>
        <span>KATHIYAWADI • PUNJABI • CHINESE • VARIETY FOODS</span>
      </div>
    </a>

    <button class="mobile" id="menuBtn" aria-label="Open menu">☰</button>

    <nav class="nav" id="nav">
      <a href="#home">Home</a>
      <a href="#about">About Us</a>
      <a href="#menu">Menu</a>
      <a href="#services">Services</a>
      <a href="#gallery">Gallery</a>
      <a href="#contact">Contact</a>
    </nav>

    <a class="cta" href="#contact">ENQUIRE NOW</a>
  </div>
</header>

<script>
const btn=document.getElementById('menuBtn');
const nav=document.getElementById('nav');
btn.addEventListener('click',()=>nav.classList.toggle('open'));
document.querySelectorAll('.nav a').forEach(a=>a.addEventListener('click',()=>nav.classList.remove('open')));
</script>
</body>
</html>
